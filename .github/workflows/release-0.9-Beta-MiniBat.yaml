name: Package and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a tag like v1.0.0

permissions:
  contents: write # Crucial: Allows GitHub to create a release and upload files

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Zip Archive
        run: |
          zip -r artifact.zip src/
          echo "Successfully zipped /src into artifact.zip"

      - name: Generate SHA-256 Hash
        run: |
          sha256sum artifact.zip > artifact.zip.sha256
          echo "SHA-256 generated:"
          cat artifact.zip.sha256

      - name: Create GitHub Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact.zip
            artifact.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
